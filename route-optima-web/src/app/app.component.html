<div class="flex h-screen w-full bg-slate-50 overflow-hidden">
  
  <aside class="w-96 bg-white border-r border-slate-200 flex flex-col shadow-xl z-20">
    <div class="p-6 border-b border-slate-100 bg-slate-50/50">
      <h1 class="text-2xl font-black text-blue-800 tracking-tighter">
        RouteOptima <span class="text-slate-400 font-light text-sm tracking-normal">v1.0</span>
      </h1>
      <p class="text-xs text-slate-500 mt-1 uppercase tracking-widest font-semibold">Logistics Control Center</p>
    </div>

    <div class="p-6 flex-1 overflow-y-auto space-y-8">
      <section>
        <h2 class="text-sm font-bold text-slate-800 mb-4 flex items-center gap-2">
          <span class="w-2 h-2 bg-blue-600 rounded-full"></span>
          Book New Shipment
        </h2>
        <div class="space-y-4">
          <div class="group">
            <label class="text-[10px] uppercase font-bold text-slate-400 group-focus-within:text-blue-600 transition-colors">Origin City</label>
            <input [(ngModel)]="newShipment.origin" type="text" placeholder="e.g. Paris" 
                   class="w-full mt-1 p-3 bg-slate-100 border-none rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition-all placeholder:text-slate-400">
          </div>
          <div class="group">
            <label class="text-[10px] uppercase font-bold text-slate-400 group-focus-within:text-blue-600 transition-colors">Destination City</label>
            <input [(ngModel)]="newShipment.destination" type="text" placeholder="e.g. London" 
                   class="w-full mt-1 p-3 bg-slate-100 border-none rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition-all placeholder:text-slate-400">
          </div>
          <button (click)="submitShipment()" 
                  class="w-full bg-blue-700 text-white py-4 rounded-xl font-bold hover:bg-blue-800 shadow-lg shadow-blue-200 active:scale-[0.98] transition-all">
            Calculate & Finalize
          </button>
        </div>
      </section>

      <section>
        <h2 class="text-sm font-bold text-slate-800 mb-4 flex items-center gap-2">
          <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
          Recent Activity
        </h2>
        <div class="space-y-3">
          <div *ngFor="let s of shipments" 
               class="p-4 bg-white border border-slate-100 rounded-2xl shadow-sm hover:border-blue-200 transition-colors cursor-pointer group">
            <div class="flex justify-between items-start">
              <div>
                <p class="text-xs font-bold text-slate-400 uppercase tracking-tighter">{{ s.status }}</p>
                <p class="font-bold text-slate-700">{{ s.origin }} → {{ s.destination }}</p>
              </div>
              <p class="text-blue-700 font-black text-lg">₹{{ s.basePrice }}</p>
            </div>
          </div>
        </div>
      </section>
    </div>

    <div class="p-6 bg-slate-900 text-white">
      <div class="flex justify-between items-center">
        <span class="text-xs font-medium text-slate-400">Total Processed</span>
        <span class="text-xl font-bold">{{ shipments.length }}</span>
      </div>
    </div>
  </aside>

  <main class="flex-1 relative bg-slate-200">
    <div id="map" class="h-full w-full z-10"></div>
    
    <div class="absolute top-6 right-6 z-20">
      <div class="bg-white/90 backdrop-blur-md p-4 rounded-2xl shadow-2xl border border-white flex items-center gap-4">
        <div class="w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center">
          <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        </div>
        <div>
          <p class="text-xs font-bold text-slate-400 uppercase">System Status</p>
          <p class="text-sm font-bold text-green-600">All Engines Nominal</p>
        </div>
      </div>
    </div>
  </main>
</div>
